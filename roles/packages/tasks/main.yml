---
- name: Validate supported platforms
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in packages_supported_platforms.get(ansible_facts['os_family'], [])
    fail_msg: "Unsupported platform: {{ ansible_facts['distribution'] }} ({{ ansible_facts['os_family'] }})"
    quiet: true

- name: Include platform-specific package tasks
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}-{{ ansible_facts['distribution'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}.yml"
